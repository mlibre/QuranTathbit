<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF6ED"/>
      <stop offset="1" stop-color="#F2EBD7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FCFAF3"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- soft paper grain: faint horizontal lines -->
  <g stroke="#E6DFCE" stroke-width="1" opacity="0.5">
    <line x1="0" y1="60" x2="1280" y2="60"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="300" x2="1280" y2="300"/>
  </g>

  <!-- decorative arc on the left, evoking the open book / folded page -->
  <g transform="translate(80,180)">
    <circle r="118" fill="#E3EFE8" opacity="0.6"/>
    <path d="M -90 0 a 90 90 0 1 0 84 -50" fill="none" stroke="#1E6B52" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="-44" r="6" fill="#C29A3B"/>
    <!-- open book pages, calm -->
    <g transform="translate(-50,-50)">
      <path d="M 0 0 q 50 -30 100 0 q -25 8 -25 22 q 0 12 25 22 q -50 30 -100 0 q 25 -10 25 -22 q 0 -14 -25 -22 z"
            fill="#F6EDD8" stroke="#1E6B52" stroke-width="1.5" opacity="0.85"/>
      <line x1="50" y1="-8" x2="50" y2="40" stroke="#C29A3B" stroke-width="1.2"/>
    </g>
  </g>

  <!-- the app's name and one quiet line -->
  <g font-family="Vazirmatn, 'Segoe UI', sans-serif">
    <text x="260" y="170" font-size="78" font-weight="700" fill="#14513D">QuranTathbit</text>
    <text x="264" y="218" font-size="26" fill="#5C6B62">a quiet companion for keeping the Qur&#x2019;n close</text>
    <text x="264" y="252" font-size="20" fill="#5C6B62">one deck &#xb7; one card at a time &#xb7; your own GitHub as the cloud</text>
  </g>

  <!-- three small cards on the right, hinting at the study flow -->
  <g transform="translate(820,90)">
    <!-- back card -->
    <rect x="20" y="20" width="170" height="220" rx="18" fill="url(#card)" stroke="#E6DFCE" stroke-width="1" transform="rotate(-6 105 130)"/>
    <!-- middle card -->
    <rect x="40" y="14" width="170" height="220" rx="18" fill="url(#card)" stroke="#E6DFCE" stroke-width="1" transform="rotate(-1 125 124)"/>
    <!-- front card -->
    <rect x="60" y="6" width="180" height="230" rx="20" fill="url(#card)" stroke="#E6DFCE" stroke-width="1.2"/>
    <!-- arabic verse hint on the front card -->
    <g transform="translate(82,40)">
      <rect x="0" y="0" width="136" height="44" rx="8" fill="#F6EDD8"/>
      <g fill="#14513D" font-family="Amiri, serif" font-size="22" text-anchor="middle">
        <text x="68" y="30">&#x628;&#x640;&#x633;&#x645; &#x627;&#x644;&#x644;&#x647;</text>
      </g>
    </g>
    <!-- translation lines -->
    <g stroke="#5C6B62" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <line x1="82" y1="108" x2="218" y2="108"/>
      <line x1="82" y1="124" x2="200" y2="124"/>
      <line x1="82" y1="140" x2="210" y2="140"/>
    </g>
    <!-- gold play button hint -->
    <g transform="translate(82,170)">
      <rect x="0" y="0" width="80" height="30" rx="15" fill="#F6EDD8"/>
      <polygon points="14,9 14,21 26,15" fill="#C29A3B"/>
      <rect x="34" y="11" width="34" height="3" rx="1.5" fill="#C29A3B" opacity="0.6"/>
      <rect x="34" y="18" width="24" height="3" rx="1.5" fill="#C29A3B" opacity="0.4"/>
    </g>
    <!-- answer buttons hint -->
    <g transform="translate(82,210)">
      <rect x="0" y="0" width="34" height="14" rx="6" fill="none" stroke="#B4553F" stroke-width="1.5"/>
      <rect x="40" y="0" width="34" height="14" rx="6" fill="none" stroke="#C29A3B" stroke-width="1.5"/>
      <rect x="80" y="0" width="34" height="14" rx="6" fill="none" stroke="#1E6B52" stroke-width="1.5"/>
      <rect x="120" y="0" width="34" height="14" rx="6" fill="none" stroke="#14513D" stroke-width="1.5"/>
    </g>
  </g>

  <!-- small "data: quran.makarem.ir" tag, bottom right -->
  <g font-family="Vazirmatn, 'Segoe UI', sans-serif" font-size="14" fill="#9C7A28">
    <rect x="1056" y="320" width="184" height="22" rx="11" fill="#F6EDD8" stroke="#C29A3B" stroke-width="0.8"/>
    <text x="1148" y="335" text-anchor="middle">data: quran.makarem.ir</text>
  </g>
</svg>
