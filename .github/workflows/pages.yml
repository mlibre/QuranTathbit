name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo install -m 755 Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install matching export templates
        run: |
          curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl
          mv tpl/templates ~/.local/share/godot/export_templates/4.7.2.stable

      # The battery runs the suites twice, warm and with the class cache
      # removed: a web build is what a stranger's browser gets, so it must
      # not be the first thing to discover a bare class reference.
      - name: Run the regression battery
        run: |
          godot --headless --path . --import
          tools/battery.sh

      # The deck the browser receives must be the package's, byte for byte:
      # this re-extracts the .apkg and fails the build on any difference.
      - name: Verify the deck against the package
        run: |
          python3 -m pip install --quiet zstandard
          python3 tools/verify_deck.py

      - name: Export the web build
        run: |
          mkdir -p builds/web
          touch builds/.gdignore
          godot --headless --path . --export-release "Web" builds/web/index.html

      # The browser's app carries the deck's text but streams its recitations
      # from this same site: copy the audio, and only the audio, to decks/
      # beside index.html, where the app looks for it at study time.
      - name: Lay the recitations beside the app
        run: |
          mkdir -p builds/web/decks
          cp -r assets/decks/quran builds/web/decks/quran
          find builds/web/decks -type f ! -name '*.mp3' -delete
          find builds/web/decks -type d -empty -delete

      # The .pck must carry the deck's text and none of its audio -- a 13 MB
      # smaller download before the first card is even seen -- and the audio
      # the app will stream must be waiting beside it. Cards reference their
      # audio by bare name in markdown, so the test asks for the deck-path
      # form only a real embedded file would have.
      - name: Check the web build carries the deck
        run: |
          test -f builds/web/index.pck
          test -f builds/web/decks/quran/001/001001.mp3
          python3 - <<'PY'
          import sys
          data = open("builds/web/index.pck", "rb").read()
          missing = [needle for needle in (b"deck.json", b"front.md", b"back.md") if needle not in data]
          if missing:
              sys.exit("ERROR: the exported .pck is missing deck text files: %s" % missing)
          if b"decks/quran/001/001001.mp3" in data or b"mp3str" in data:
              sys.exit("ERROR: the exported .pck embeds deck audio; the web build streams it from decks/ instead")
          if len(data) > 3_000_000:
              sys.exit("ERROR: the web .pck is %d bytes; the deck's audio should stream, not embed" % len(data))
          print("web .pck carries the deck text (%d KB) and streams its audio from decks/" % (len(data) // 1024))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
