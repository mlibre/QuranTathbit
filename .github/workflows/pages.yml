name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo install -m 755 Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install matching export templates
        run: |
          curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl
          mv tpl/templates ~/.local/share/godot/export_templates/4.7.2.stable

      # The battery runs the suites twice, warm and with the class cache
      # removed: a web build is what a stranger's browser gets, so it must
      # not be the first thing to discover a bare class reference.
      - name: Run the regression battery
        run: |
          godot --headless --path . --import
          tools/battery.sh

      - name: Export the web build
        run: |
          mkdir -p builds/web
          touch builds/.gdignore
          godot --headless --path . --export-release "Web" builds/web/index.html

      # The deck must ride inside the .pck: if the include filter ever loses
      # the markdown, json or mp3 files, the exported app boots without its
      # deck and this line catches it before a browser ever sees it.
      - name: Check the web build carries the deck
        run: |
          test -f builds/web/index.pck
          python3 - <<'PY'
          import re, sys
          data = open("builds/web/index.pck", "rb").read()
          missing = [needle for needle in (b"deck.json", b"front.md", b".mp3") if needle not in data]
          if missing:
              sys.exit("ERROR: the exported .pck is missing deck files: %s" % missing)
          print("web .pck carries the deck files")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
