name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo install -m 755 Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install matching export templates
        run: |
          curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl
          mv tpl/templates ~/.local/share/godot/export_templates/4.7.2.stable

      # The battery runs the suites twice, warm and with the class cache
      # removed: a web build is what a stranger's browser gets, so it must
      # not be the first thing to discover a bare class reference.
      - name: Run the regression battery
        run: |
          godot --headless --path . --import
          tools/battery.sh

      # The deck the browser receives must be the package's, byte for byte:
      # this re-extracts the .apkg and fails the build on any difference.
      - name: Verify the deck against the package
        run: |
          python3 -m pip install --quiet zstandard
          python3 tools/verify_deck.py

      - name: Export the web build
        run: |
          mkdir -p builds/web
          touch builds/.gdignore
          godot --headless --path . --export-release "Web" builds/web/index.html

      # The engine's own loader speaks today's browsers: optional chaining
      # and its kin parse nowhere on the phones a reader keeps longest --
      # Firefox 68 on Android 5 was the report: the page opened and the
      # loading bar never moved, because index.js never ran at all. The
      # same bytes, lowered once through esbuild to the level those
      # browsers read (firefox68 covers Fennec, chrome57 the WebViews of
      # the same vintage), parse and run again. Verified by node and by
      # token, so a future engine that grows newer syntax fails THIS build
      # loudly instead of silently on a reader's phone.
      - name: Make the loader speak older browsers
        run: |
          npx --yes esbuild@0.28.2 builds/web/index.js --target=firefox68,chrome57 --outfile=builds/web/index.js
          node --check builds/web/index.js
          python3 - <<'PY'
          import re, sys
          data = open("builds/web/index.js", encoding="utf-8").read()
          blockers = {
              "optional chaining": r"\?\.",
              "nullish coalescing": r"[^?]\?\?[^=]",
              "logical assignment": r"(&&|\|\||\?\?)=",
              "catch without binding": r"catch\s*\{",
          }
          found = {k: len(re.findall(p, data)) for k, p in blockers.items()}
          bad = {k: v for k, v in found.items() if v}
          if bad:
              sys.exit("ERROR: index.js still carries syntax an old phone cannot parse: %s" % bad)
          print("loader speaks firefox68/chrome57: no post-2017 parse-breakers left")
          PY

      # The browser's app carries the deck's text but streams its recitations
      # from this same site: copy the audio, and only the audio, to decks/
      # beside index.html, where the app looks for it at study time.
      - name: Lay the recitations beside the app
        run: |
          mkdir -p builds/web/decks
          cp -r assets/decks/quran builds/web/decks/quran
          find builds/web/decks -type f ! -name '*.mp3' -delete
          find builds/web/decks -type d -empty -delete

      # GitHub Pages serves the .wasm raw (no content-encoding): 39.5 MB over
      # the wire for every first visit. gzip -9 makes it 10 MB; the page's
      # head script (html/head_include) swaps the engine's fetch to the .gz
      # and decompresses it in the browser, falling back to the raw file when
      # the .gz is absent. The service worker should cache the bytes the page
      # actually asks for -- the .gz -- so a returning visitor loads from the
      # local cache instead of the network.
      - name: Ship the engine compressed
        run: |
          test -f builds/web/index.wasm
          gzip -9 -k builds/web/index.wasm
          sed -i 's/"index.wasm"/"index.wasm.gz"/' builds/web/index.service.worker.js
          grep -q '"index.wasm.gz"' builds/web/index.service.worker.js
          # The installed app's title bar should wear the app's colours, not black.
          sed -i 's/"background_color":"#000000"/"background_color":"#faf5ed","theme_color":"#14513d"/' builds/web/index.manifest.json
          ls -la builds/web/index.wasm builds/web/index.wasm.gz

      # Installable on a phone's home screen (a PWA): Chrome's install
      # criteria ask for a 192px icon beside the 512px one and a short_name
      # for the label under it. The exporter writes neither, so both are
      # patched in here -- the icon from the same PNG the Android launcher
      # uses, the label the app's own name.
      - name: Make the app installable
        run: |
          cp assets/icons/icon_192.png builds/web/index.192x192.png
          python3 - <<'PY'
          import json
          path = "builds/web/index.manifest.json"
          manifest = json.load(open(path))
          manifest["short_name"] = "QuranTathbit"
          # The app is built for a hand: the installed web app stands upright,
          # the way the Android build does (its export preset locks portrait).
          manifest["orientation"] = "portrait"
          manifest["description"] = "A calm app for memorising the Qur'an."
          manifest["icons"] = [{"sizes": "192x192", "src": "index.192x192.png", "type": "image/png"}] + [
              i for i in manifest["icons"] if i.get("sizes") != "192x192"
          ]
          json.dump(manifest, open(path, "w"), separators=(",", ":"))
          print("manifest:", open(path).read())
          PY
          test -f builds/web/index.192x192.png
          grep -q "index.192x192.png" builds/web/index.manifest.json

      # The .pck must carry the deck's text and none of its audio -- a 13 MB
      # smaller download before the first card is even seen -- and the audio
      # the app will stream must be waiting beside it. Cards reference their
      # audio by bare name in markdown, so the test asks for the deck-path
      # form only a real embedded file would have.
      # The engine listens for keydown on the canvas and preventDefault()s
      # every one, which eats the browser's own shortcuts -- F5, Ctrl+F5,
      # F11, Ctrl+L and friends stopped working the moment the canvas took
      # focus. The head_include ships a capture-phase gate on window that
      # stops propagation for the browser-reserved combos (and only those:
      # Space, 1-4 and Esc still belong to the app), so the default action
      # survives and the tab behaves like a tab again. The same gate takes
      # Ctrl+V/Cmd+V away from the engine -- whose paste reads a cache a
      # keystroke behind and asks the browser for a permission sheet -- and
      # the qt-paste-bridge script hands the page's own paste events to the
      # app instead: fresh text, no prompt, first press.
      - name: Check the web build carries the deck
        run: |
          test -f builds/web/index.pck
          test -f builds/web/decks/quran/001/001001.mp3
          test -f builds/web/index.wasm.gz
          grep -q "index.wasm.gz" builds/web/index.html
          # The marker alone would pass even if the gate arrived truncated
          # (a ConfigFile value ends at the first unescaped double quote --
          # the gate is written in single quotes for exactly that reason),
          # so the check demands its working parts, not its name.
          grep -q "qt-browser-keys" builds/web/index.html
          grep -q "stopImmediatePropagation" builds/web/index.html
          grep -q "addEventListener('keydown'" builds/web/index.html
          # A session can outlive the version it runs: the head script asks the
          # service worker to re-check itself every fifteen minutes and each
          # time the tab is looked at again; a newer waiting worker becomes the
          # engine's pwa_update_available, which Home answers with a quiet
          # Update offer that swaps the page in place of a refresh. The marker
          # alone would pass even if the watcher arrived truncated, so the
          # check demands its working parts, not its name.
          grep -q "qt-update-watch" builds/web/index.html
          grep -q "getRegistration" builds/web/index.html
          grep -q "visibilitychange" builds/web/index.html
          grep -q "reg.update" builds/web/index.html
          # Paste reaches the app through the page's own event, not a
          # permission sheet: the marker alone would pass even if the bridge
          # arrived truncated, so the check demands its working parts too.
          grep -q "qt-paste-bridge" builds/web/index.html
          grep -q "addEventListener('paste'" builds/web/index.html
          grep -q "__qtPasteBridge" builds/web/index.html
          # The WebGL2 pre-flight guard rides the page's head the same way:
          # a device that cannot run the app is told so, in its own words,
          # instead of being left watching a bar that never moves -- and the
          # engine's engine-sized download never starts on a device that
          # could never run it.
          grep -q "qt-webgl2-guard" builds/web/index.html
          grep -q "__qtWebGL2Missing" builds/web/index.html
          python3 - <<'PY'
          import sys
          data = open("builds/web/index.pck", "rb").read()
          missing = [needle for needle in (b"deck.json", b"front.md", b"back.md") if needle not in data]
          if missing:
              sys.exit("ERROR: the exported .pck is missing deck text files: %s" % missing)
          if b"decks/quran/001/001001.mp3" in data or b"mp3str" in data:
              sys.exit("ERROR: the exported .pck embeds deck audio; the web build streams it from decks/ instead")
          if len(data) > 3_000_000:
              sys.exit("ERROR: the web .pck is %d bytes; the deck's audio should stream, not embed" % len(data))
          gz = len(open("builds/web/index.wasm.gz", "rb").read())
          if gz > 15_000_000:
              sys.exit("ERROR: index.wasm.gz is %d bytes; the compressed engine stopped being small" % gz)
          raw = len(open("builds/web/index.wasm", "rb").read())
          print("web .pck %d KB (text only); engine %d KB raw, %d KB on the wire" % (len(data)//1024, raw//1024, gz//1024))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
