name: Publish to npm

# Builds the web export, lays the recitations beside it (the way the Pages
# workflow does), and publishes the result to npm as the `qurantathbit` package.
# A user can then `npx qurantathbit` and get the app at localhost:8080, or
# install it as a dependency and serve the files from their own host.
#
# Runs on every `v*` tag (the same tag that drives the desktop release builds)
# so each release ships a fresh npm package; also runnable by hand from the
# Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and templates
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip && sudo install -m 755 Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl && mv tpl/templates ~/.local/share/godot/export_templates/4.7.2.stable
          godot --version

      - name: Run the regression battery
        run: |
          godot --headless --path . --import
          tools/battery.sh

      - name: Verify the deck against the package
        run: |
          python3 -m pip install --quiet zstandard
          python3 tools/verify_deck.py

      - name: Export the web build
        run: |
          mkdir -p builds/web
          touch builds/.gdignore
          godot --headless --path . --export-release "Web" builds/web/index.html

      # The engine's loader must speak the browsers a reader keeps longest
      # (the Pages workflow explains why); the npm package serves the same
      # page from a local disk, so its loader is lowered the same way.
      - name: Make the loader speak older browsers
        run: |
          npx --yes esbuild@0.28.2 builds/web/index.js --target=firefox68,chrome57 --outfile=builds/web/index.js --allow-overwrite
          node --check builds/web/index.js
          python3 - <<'PY'
          import re, sys
          data = open("builds/web/index.js", encoding="utf-8").read()
          blockers = {
              "optional chaining": r"\?\.",
              "nullish coalescing": r"[^?]\?\?[^=]",
              "logical assignment": r"(&&|\|\||\?\?)=",
              "catch without binding": r"catch\s*\{",
          }
          found = {k: len(re.findall(p, data)) for k, p in blockers.items()}
          bad = {k: v for k, v in found.items() if v}
          if bad:
              sys.exit("ERROR: index.js still carries syntax an old phone cannot parse: %s" % bad)
          print("loader speaks firefox68/chrome57: no post-2017 parse-breakers left")
          PY

      # The web build's .pck carries the deck's text; the audio streams from
      # decks/quran/ beside index.html. Both must land in the npm package.
      - name: Lay the recitations beside the app
        run: |
          mkdir -p builds/web/decks
          cp -r assets/decks/quran builds/web/decks/quran
          find builds/web/decks -type f ! -name '*.mp3' -delete
          find builds/web/decks -type d -empty -delete

      # The npm package serves from a local disk, where the raw .wasm costs
      # nothing to transfer: no .gz is shipped (the page's fetch patch falls
      # back to the raw file when the .gz is absent) and the worker keeps
      # caching the raw file on first load. It still takes over the moment
      # it installs -- the same skipWaiting patch the Pages build carries,
      # for the same reason: a waiting worker heals nothing while the page
      # it should heal is the one that cannot run. Only the installed-app
      # colours are aligned with the Pages build beyond that.
      - name: The worker takes over at once
        run: |
          python3 - <<'PY'
          import sys
          path = "builds/web/index.service.worker.js"
          data = open(path, encoding="utf-8").read()
          pairs = [
              (
                  "\tevent.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(CACHED_FILES)));\n});",
                  "\tevent.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(CACHED_FILES)).then(() => self.skipWaiting()));\n});",
              ),
              (
                  "return ('navigationPreload' in self.registration) ? self.registration.navigationPreload.enable() : Promise.resolve();\n\t}));",
                  "return ('navigationPreload' in self.registration) ? self.registration.navigationPreload.enable() : Promise.resolve();\n\t}).then(() => self.clients.claim()));",
              ),
          ]
          for old, new in pairs:
              if old not in data:
                  sys.exit("ERROR: the worker's shape changed; the skipWaiting patch needs rewriting: %r" % old[:60])
              data = data.replace(old, new)
          open(path, "w", encoding="utf-8").write(data)
          print("worker: installs skip waiting, activates claim clients")
          PY
          grep -q "skipWaiting" builds/web/index.service.worker.js
          grep -q "clients.claim" builds/web/index.service.worker.js

      # The npm package serves the same page the site does, so its head
      # scripts live by the same rule: a script that cannot parse never
      # runs, whatever its markers say (a missing </script> or a \n the
      # config parser turned into a real line break both shipped once and
      # left a phone at a silent loading bar). Every inline script is
      # taken apart the way a browser reads it and handed to node --check;
      # the worker rides the same rule.
      - name: Every head script must parse
        run: |
          python3 tools/check_head_scripts.py builds/web/index.html
          node --check builds/web/index.service.worker.js

      - name: Stage the npm package
        run: |
          sed -i 's/"background_color":"#000000"/"background_color":"#faf5ed","theme_color":"#14513d"/' builds/web/index.manifest.json
          # Installable on a phone's home screen: the 192px icon and the
          # short_name the exporter never writes, the same patch the Pages
          # build carries.
          cp assets/icons/icon_192.png builds/web/index.192x192.png
          python3 - <<'PY'
          import json
          path = "builds/web/index.manifest.json"
          manifest = json.load(open(path))
          manifest["short_name"] = "QuranTathbit"
          manifest["description"] = "A calm app for memorising the Qur'an."
          manifest["icons"] = [{"sizes": "192x192", "src": "index.192x192.png", "type": "image/png"}] + [
              i for i in manifest["icons"] if i.get("sizes") != "192x192"
          ]
          json.dump(manifest, open(path, "w"), separators=(",", ":"))
          print("manifest:", open(path).read())
          PY
          # The browser-shortcut gate (qt-browser-keys) must ride along: it is
          # part of the page's head, and the npm package serves that same page.
          grep -q "qt-browser-keys" builds/web/index.html
          grep -q "stopImmediatePropagation" builds/web/index.html
          grep -q "addEventListener('keydown'" builds/web/index.html
          # The boot watch rides that same head, the same way: a page that
          # cannot start says why, a load gone quiet says so.
          grep -q "qt-boot-watch" builds/web/index.html
          grep -q "unhandledrejection" builds/web/index.html
          grep -q "controllerchange" builds/web/index.html
          grep -q "postMessage('claim')" builds/web/index.html
          # The SIMD guard rides the same head: a 32-bit phone Firefox has
          # WebGL2 but no WebAssembly SIMD, and the engine cannot run there
          # -- the same guard the Pages build carries, demanded by its
          # working parts, as always.
          grep -q "qt-simd-guard" builds/web/index.html
          grep -q "__qtWasmSimdMissing" builds/web/index.html
          mkdir -p pkg
          cp builds/web/index.html builds/web/index.js builds/web/index.wasm \
                builds/web/index.pck builds/web/index.png \
                builds/web/index.icon.png builds/web/index.apple-touch-icon.png \
                builds/web/index.192x192.png \
                builds/web/index.audio.worklet.js builds/web/index.audio.position.worklet.js \
                builds/web/index.manifest.json builds/web/index.service.worker.js \
                builds/web/index.offline.html \
                builds/web/index.144x144.png builds/web/index.180x180.png builds/web/index.512x512.png \
                pkg/ 2>/dev/null || true
          cp -r builds/web/decks pkg/decks
          cp start.js pkg/start.js
          # Shipped as README.md so the npm registry page displays it.
          cp docs/README.npm.md pkg/README.md
          cp LICENSE pkg/LICENSE
          cp package.json pkg/package.json
          # Show what we are about to publish, so the log is auditable.
          ls -la pkg
          du -sh pkg

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - name: Publish to npm
        working-directory: pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # A publish that races itself (a re-pushed tag, a hand re-run) must
        # be a skip, not a red X: the registry refuses to overwrite a
        # version, and the same tree publishing the same version again has
        # nothing left to do.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "qurantathbit@$VERSION" version 2>/dev/null | grep -qx "$VERSION"; then
            echo "qurantathbit@$VERSION is already on the registry; nothing to publish."
          else
            npm publish --access public
          fi
