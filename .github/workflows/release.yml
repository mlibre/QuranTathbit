name: Release builds

# Every push to the house's own branch is a release when the version it
# carries has none: prepare reads the version the tree speaks, checks it
# against the one the releases page already has, and the three export legs
# run only when a release is owed. The release job cuts the tag itself, at
# the exact commit the build came from, and lands the four artifacts on it --
# so a version is tagged, built and published by nothing but the push that
# carries it. A push whose version is already out is a silence: green, and
# nothing built. A hand-pushed v* tag keeps its old door (it builds and
# publishes under its own name), and a manual dispatch is the repair lane --
# run it on the house's branch and it finishes a version whose release is
# missing; it stands down everywhere else.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Two pushes must not race each other to the releases page: the queue
  # keeps one run of this workflow on the track at a time, and each run
  # re-asks "is my version out yet" when its own turn comes.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this push owes a release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One version is the truth: package.json (the npm package's own
          # word), version.gd (the About line) and both export presets must
          # say the same thing, or the push is refused -- a half-bumped tree
          # would cut a tag the app itself does not carry.
          VERSION=$(jq -r .version package.json)
          GD=$(sed -n 's/^const VERSION := "\(.*\)"/\1/p' scripts/data/version.gd)
          PRESETS=$(sed -n 's/^version\/name="\(.*\)"/\1/p' export_presets.cfg | sort -u)
          if [ "$(printf '%s\n%s\n%s\n' "$VERSION" "$GD" "$PRESETS" | sort -u | wc -l)" -ne 1 ]; then
            echo "the version drifted: package.json says $VERSION, version.gd says $GD, presets say:"
            echo "$PRESETS"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # On a tag push the tag is its own command, named as it was pushed.
          # On the house's branch the tag is the version's own, cut later at
          # the commit this build came from. Anywhere else -- a manual
          # dispatch on a side branch -- nothing is owed and nothing runs.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release=yes" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "release=no" >> "$GITHUB_OUTPUT"
          elif gh release view -R "$GITHUB_REPOSITORY" "v$VERSION" >/dev/null 2>&1; then
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "release=no" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "release=yes" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: prepare
    if: needs.prepare.outputs.release == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and templates
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip && sudo install -m 755 Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl && mv tpl/templates ~/.local/share/godot/export_templates/4.7.2.stable
      - name: Run the regression battery
        run: |
          godot --headless --path . --import
          tools/battery.sh
      # The deck inside the artifact must be the package's own, byte for byte.
      - name: Verify the deck against the package
        run: |
          python3 -m pip install --quiet zstandard
          python3 tools/verify_deck.py
      - name: Export Windows build
        run: |
          mkdir -p builds/windows
          touch builds/.gdignore
          godot --headless --path . --export-release "Windows" builds/windows/QuranTathbit.exe
      - name: Check the build carries the deck
        run: |
          python3 - <<'PY'
          data = open("builds/windows/QuranTathbit.exe", "rb").read()
          missing = [n for n in (b"deck.json", b"front.md", b".mp3") if n not in data]
          assert not missing, "the exe's embedded .pck is missing deck files: %s" % missing
          print("windows build carries the deck files")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: QuranTathbit-windows
          path: builds/windows/QuranTathbit.exe

  linux:
    needs: prepare
    if: needs.prepare.outputs.release == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and templates
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip && sudo install -m 755 Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl && mv tpl/templates ~/.local/share/godot/export_templates/4.7.2.stable
      - name: Export Linux build
        run: |
          mkdir -p builds/linux
          touch builds/.gdignore
          godot --headless --path . --import
          godot --headless --path . --export-release "Linux" builds/linux/QuranTathbit.x86_64
      - name: Smoke the exported binary
        run: |
          chmod +x builds/linux/QuranTathbit.x86_64
          builds/linux/QuranTathbit.x86_64 --headless --quit-after 300 | tee boot.log
          grep -q "QURAN_TATHBIT_BOOT_OK" boot.log
      - uses: actions/upload-artifact@v4
        with:
          name: QuranTathbit-linux
          path: builds/linux/QuranTathbit.x86_64

  android:
    needs: prepare
    if: needs.prepare.outputs.release == 'yes'
    runs-on: ubuntu-latest
    # The signing key lives in this environment's secrets, not in the
    # repository: a keystore any reader can download -- its password printed
    # in the workflow that uses it -- signs anyone's APK, and an update that
    # installs over the reader's app must be signed by the one hand the
    # reader trusts. The job asks for the environment by name and GitHub
    # hands it the key, the password and the alias; the log sees only the
    # masked words, never the key itself.
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # No setup-android action: GitHub's ubuntu runners ship a preinstalled
      # SDK (ANDROID_HOME points at it) with the build-tools and platform
      # packages the export needs, and the action itself has been the flaky leg
      # of this job in the field.
      - name: Install Godot 4.7.2 and templates
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip && sudo install -m 755 Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl && mv tpl/templates ~/.local/share/godot/export_templates/4.7.2.stable
      - name: Restore the release keystore from the environment
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "${RUNNER_TEMP}/tathbit.keystore"
          test -s "${RUNNER_TEMP}/tathbit.keystore"
      # The engine cannot lay the APK down bare: a release export without a
      # keystore is refused outright ("Could not find release keystore"), so
      # the export wears Godot's own first pass -- a v1 JAR signature from
      # the same key the environment holds. But v1 alone is exactly what
      # modern Android turns away, and what taught the reader to uninstall
      # before every update. The next step strips that scaffold and signs
      # the APK the way the phone actually reads: zipaligned, then v1 and
      # v2 together, every release from the same key -- the same key is what
      # makes an update land as an update.
      - name: Export Android builds (Godot's v1 pass)
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/tathbit.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p builds/android builds/android-persian
          touch builds/.gdignore
          godot --headless --path . --import
          godot --headless --path . --export-release "Android" builds/android/QuranTathbit-unsigned.apk
          godot --headless --path . --export-release "Android Persian" builds/android-persian/QuranTathbit-fa-unsigned.apk
      - name: Sign v1+v2 with the environment's key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          BT="$(ls -d "${ANDROID_HOME}/build-tools/"* | sort -V | tail -1)"
          ZIPALIGN="$BT/zipalign"
          APKSIGNER="$BT/apksigner"
          test -x "$ZIPALIGN" && test -x "$APKSIGNER"
          sign_one() {
            local src="$1" out="$2" aligned="${RUNNER_TEMP}/aligned.apk"
            # The engine's v1 scaffold leaves with the scaffold: only the
            # hand in this step signs the APK the reader installs.
            zip -d "$src" "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/*.EC" >/dev/null 2>&1 || true
            "$ZIPALIGN" -f -p 4 "$src" "$aligned"
            "$APKSIGNER" sign \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --ks "${RUNNER_TEMP}/tathbit.keystore" \
              --ks-key-alias "$ANDROID_KEYSTORE_ALIAS" \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --key-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --out "$out" "$aligned"
            local verdict="${RUNNER_TEMP}/verify.log"
            "$APKSIGNER" verify --verbose --print-certs "$out" > "$verdict" || cat "$verdict"
            grep -q "Verified using APK Signature Scheme v2: true" "$verdict" \
              || { echo "the signed APK carries no v2 scheme: $out"; cat "$verdict"; exit 1; }
            rm -f "$src" "$aligned" "$verdict"
          }
          sign_one builds/android/QuranTathbit-unsigned.apk builds/android/QuranTathbit.apk
          sign_one builds/android-persian/QuranTathbit-fa-unsigned.apk builds/android-persian/QuranTathbit-fa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: QuranTathbit-android
          path: builds/android/QuranTathbit.apk
      - uses: actions/upload-artifact@v4
        with:
          name: QuranTathbit-android-persian
          path: builds/android-persian/QuranTathbit-fa.apk

  release:
    needs: [prepare, windows, linux, android]
    if: needs.prepare.outputs.release == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          zip -j QuranTathbit-Windows.zip QuranTathbit-windows/QuranTathbit.exe
          zip -j QuranTathbit-Linux.zip QuranTathbit-linux/QuranTathbit.x86_64
          cp QuranTathbit-android/QuranTathbit.apk QuranTathbit-Android.apk
          cp QuranTathbit-android-persian/QuranTathbit-fa.apk QuranTathbit-Android-fa.apk
          # This job checks out nothing, so gh cannot discover the repository
          # from git; every call names it explicitly with -R.
          if gh release view -R "$GITHUB_REPOSITORY" "$TAG" >/dev/null 2>&1; then
            gh release upload -R "$GITHUB_REPOSITORY" "$TAG" QuranTathbit-Windows.zip QuranTathbit-Linux.zip QuranTathbit-Android.apk QuranTathbit-Android-fa.apk --clobber
          else
            # The tag is cut here, at the exact commit the build came from,
            # and the release lands on it in the same breath.
            gh release create -R "$GITHUB_REPOSITORY" "$TAG" --target "$GITHUB_SHA" \
              QuranTathbit-Windows.zip QuranTathbit-Linux.zip QuranTathbit-Android.apk QuranTathbit-Android-fa.apk \
              --title "QuranTathbit $TAG" \
              --notes "One deck, kept as folders and files. Unzip, run, study. The Android APK is self-signed: allow installs from this source when your phone asks. QuranTathbit-Android-fa.apk is the same app pre-configured in Persian: no language question, no language in Settings. Quran text, translation and recitation from https://quran.makarem.ir/"
          fi
